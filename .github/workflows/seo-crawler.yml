name: Build SEO crawler

on:
  push:
    paths:
      - "tools/seo-crawler/**"
      - ".github/workflows/seo-crawler.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: FreeSEOCrawler-Windows
          - os: macos-latest
            name: FreeSEOCrawler-Mac-AppleSilicon
          - os: macos-15-intel
            name: FreeSEOCrawler-Mac-Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/seo-crawler
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Test - crawl the test site and check every planted problem is found
        run: python tests/test_checks.py

      - name: Test - custom search, structured data, accessibility, link score, GSC, logs, speed, report, alerts
        run: python tests/test_features.py

      - name: Build (Windows) - installer and portable zip
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          python build.py --installer
          Compress-Archive -Path dist\FreeSEOCrawler -DestinationPath dist\FreeSEOCrawler-Portable.zip

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: ./build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            tools/seo-crawler/dist/*.exe
            tools/seo-crawler/dist/*.zip
          if-no-files-found: error
