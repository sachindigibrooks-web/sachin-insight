name: Build video downloader

on:
  push:
    paths:
      - "tools/video-downloader/**"
      - ".github/workflows/video-downloader.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: FreeVideoDownloader-Windows
          - os: macos-latest
            name: FreeVideoDownloader-Mac-AppleSilicon
          - os: macos-15-intel
            name: FreeVideoDownloader-Mac-Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/video-downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name FreeVideoDownloader --collect-all imageio_ffmpeg app.py
          python -m PyInstaller --noconfirm --onefile --name FreeVideoDownloaderWeb --add-data "web;web" --collect-all imageio_ffmpeg web.py

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: ./build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            tools/video-downloader/dist/*.exe
            tools/video-downloader/dist/*.zip
          if-no-files-found: error
