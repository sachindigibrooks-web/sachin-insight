<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free SEO Crawler — Made by Sachin Samria</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #fff; --text: #1a1d29; --muted: #687085; --line: #e3e6ee;
    --accent: #1f7a4d; --accent-2: #2fae6e; --err: #d33a2c; --warn: #d98a00; --note: #3b6fd8;
    --soft: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1116; --card: #181b23; --text: #e9ecf3; --muted: #959cb0; --line: #2a2f3b; --soft: #20242e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; }
  header h1 span { color: var(--accent); }
  header .credit { color: var(--muted); font-size: 13px; font-weight: 600; }
  header .grow { flex: 1; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; border-radius: 9px; }
  input[type=text], input[type=number], select { padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { border: 0; padding: 10px 18px; cursor: pointer; font-weight: 600; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; white-space: nowrap; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  #url { flex: 1; min-width: 220px; font-size: 16px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 10px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 18px; margin-top: 12px; font-size: 14px; }
  .opts label { display: flex; gap: 8px; align-items: center; }
  .opts input[type=number] { width: 100px; padding: 6px 10px; }
  .hint { color: var(--muted); font-size: 13px; }
  .bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 12px 0 6px; }
  .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s; }
  .hidden { display: none !important; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tabs button { background: none; color: var(--muted); border-radius: 0; padding: 10px 16px; border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .tile { background: var(--soft); border-radius: 12px; padding: 14px; }
  .tile b { display: block; font-size: 26px; line-height: 1.2; }
  .tile small { color: var(--muted); }
  .score { display: flex; align-items: center; gap: 18px; }
  .ring { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 800; flex: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hbar { display: grid; grid-template-columns: 70px 1fr 60px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
  .hbar span:nth-child(2) { height: 14px; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .sev { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex: none; }
  .sev.error { background: var(--err); } .sev.warning { background: var(--warn); } .sev.notice { background: var(--note); }
  .issues { display: grid; grid-template-columns: 380px 1fr; gap: 16px; align-items: start; }
  .ilist { max-height: 70vh; overflow: auto; }
  .ilist button { display: flex; width: 100%; text-align: left; background: none; color: var(--text); border-radius: 8px; padding: 8px 10px; font-weight: 500; align-items: center; gap: 4px; }
  .ilist button:hover, .ilist button.on { background: var(--soft); }
  .ilist button span:nth-child(2) { flex: 1; min-width: 0; }
  .ilist button em { flex: none; font-style: normal; color: var(--muted); font-size: 13px; padding-left: 8px; }
  .ilist h4 { margin: 12px 10px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .fix { background: var(--soft); border-radius: 10px; padding: 12px 14px; margin: 8px 0 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
  th { color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; position: sticky; top: 0; background: var(--card); }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
  .tablewrap { max-height: 70vh; overflow: auto; }
  .code { font-weight: 700; } .c2 { color: var(--accent); } .c3 { color: var(--warn); } .c4, .c5, .c0 { color: var(--err); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 9; }
  .modal .card { width: min(980px, 100%); max-height: 88vh; overflow: auto; margin: 0; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv b { color: var(--muted); font-weight: 600; }
  .crawls { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--soft); color: var(--text); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
  .chip.on { outline: 2px solid var(--accent); }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  a { color: var(--note); }
  @media (max-width: 860px) { .issues, .grid2 { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1><span>🕷</span> <span data-t="app" style="color:inherit">Free SEO Crawler</span></h1>
  <span class="credit" data-t="credit">Made by Sachin Samria</span>
  <span class="grow"></span>
  <button class="ghost" id="settingsBtn" type="button" data-t="app_settings">⚙ Settings</button>
  <button class="ghost" id="langBtn" type="button">हिंदी</button>
</header>

<main>
  <div class="card">
    <p class="hint" style="margin-top:0" data-t="tagline"></p>
    <form class="row" id="startForm">
      <input type="text" id="url" data-ph="url_ph" placeholder="https://example.com" required>
      <button type="submit" id="startBtn" data-t="start">Start crawl</button>
      <button type="button" id="stopBtn" class="danger hidden" data-t="stop">Stop</button>
    </form>
    <details>
      <summary data-t="settings">Settings</summary>
      <div class="opts">
        <label><span data-t="max_pages">Max pages</span> <input type="number" id="maxPages" value="10000" min="1"></label>
        <label><span data-t="speed">Parallel requests</span> <input type="number" id="concurrency" value="5" min="1" max="20"></label>
        <label><input type="checkbox" id="robots" checked> <span data-t="respect_robots">Obey robots.txt</span></label>
        <label><input type="checkbox" id="external" checked> <span data-t="check_external">Check external links</span></label>
        <label><input type="checkbox" id="images" checked> <span data-t="check_images">Check images</span></label>
        <label><input type="checkbox" id="sitemaps" checked> <span data-t="sitemaps">Use XML sitemaps</span></label>
        <label><input type="checkbox" id="subdomains"> <span data-t="subdomains">Include subdomains</span></label>
        <label style="grid-column:1/-1"><input type="checkbox" id="renderJs"> <span data-t="render_js">Render JavaScript</span></label>
      </div>
      <p class="hint" data-t="render_hint"></p>
      <label class="hint" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="a11y" checked> <span data-t="accessibility"></span></label>
      <div style="margin-top:12px"><b data-t="custom_rules">Custom search & extraction</b>
        <p class="hint" data-t="custom_hint" style="margin:2px 0 6px"></p>
        <div id="rules"></div>
        <button class="ghost" type="button" id="addRule" data-t="add_rule">+ Add rule</button></div>
      <p class="hint" data-t="speed_hint"></p>
    </details>
    <div id="progressBox" class="hidden">
      <div class="bar"><div id="bar"></div></div>
      <div class="hint" id="progressText"></div>
    </div>
    <p class="hint" data-t="polite" style="margin-bottom:0"></p>
  </div>

  <div class="card" id="crawlsCard">
    <div class="row" style="justify-content:space-between">
      <b data-t="crawls">Your crawls</b>
      <button class="ghost" id="deleteBtn" type="button" data-t="delete">Delete</button>
    </div>
    <div class="crawls" id="crawlList" style="margin-top:10px"></div>
  </div>

  <div id="results" class="hidden">
    <div class="tabs">
      <button data-tab="overview" class="on" data-t="overview">Overview</button>
      <button data-tab="issues" data-t="issues">Issues</button>
      <button data-tab="pages" data-t="pages">Pages</button>
      <button data-tab="custom" data-t="t_custom">Custom</button>
      <button data-tab="map" data-t="t_map">Site map</button>
      <button data-tab="speed" data-t="t_speed">Speed</button>
      <button data-tab="gsc" data-t="t_gsc">Search Console</button>
      <button data-tab="logs" data-t="t_logs">Logs</button>
      <button data-tab="compare" data-t="compare">Compare</button>
      <button data-tab="schedules" data-t="t_schedules">Schedules</button>
      <button data-tab="report" data-t="t_report">Report</button>
      <button data-tab="export" data-t="export">Export</button>
    </div>

    <section id="tab-overview">
      <div class="card score">
        <div class="ring" id="ring">–</div>
        <div><b style="font-size:18px" data-t="health">Site health</b><div class="hint" data-t="health_hint"></div>
          <div class="hint" id="aiInfo" style="margin-top:6px"></div></div>
      </div>
      <div class="tiles card" id="tiles"></div>
      <div class="grid2">
        <div class="card"><b data-t="status_codes">Status codes</b><div id="codes" style="margin-top:10px"></div></div>
        <div class="card"><b data-t="depth">Click depth</b><div id="depths" style="margin-top:10px"></div></div>
      </div>
      <div class="card"><b data-t="issues">Issues</b><div id="topIssues" style="margin-top:8px"></div></div>
    </section>

    <section id="tab-issues" class="hidden">
      <div class="issues">
        <div class="card ilist" id="issueList"></div>
        <div class="card" id="issueDetail"><span class="hint" data-t="pick_issue"></span></div>
      </div>
    </section>

    <section id="tab-pages" class="hidden">
      <div class="card">
        <div class="row">
          <select id="view">
            <option value="html" data-t="v_html">HTML pages</option>
            <option value="internal" data-t="v_internal">All internal</option>
            <option value="errors" data-t="v_errors">Errors</option>
            <option value="redirects" data-t="v_redirects">Redirects</option>
            <option value="external" data-t="v_external">External</option>
            <option value="images" data-t="v_images">Images</option>
            <option value="blocked" data-t="v_blocked">Blocked</option>
          </select>
          <input type="text" id="q" data-ph="search" style="flex:1">
          <span class="hint" id="pageInfo"></span>
          <button class="ghost" id="prevBtn" type="button" data-t="prev">Previous</button>
          <button class="ghost" id="nextBtn" type="button" data-t="next">Next</button>
        </div>
        <div class="tablewrap" style="margin-top:12px"><table id="pageTable"></table></div>
      </div>
    </section>

    <section id="tab-compare" class="hidden">
      <div class="card">
        <p class="hint" data-t="compare_hint" style="margin-top:0"></p>
        <div class="row">
          <label><span data-t="older">Older crawl</span> <select id="cmpA"></select></label>
          <label><span data-t="newer">Newer crawl</span> <select id="cmpB"></select></label>
          <button type="button" id="cmpBtn" data-t="compare">Compare</button>
        </div>
        <div id="cmpOut" style="margin-top:14px"></div>
      </div>
    </section>

    <section id="tab-custom" class="hidden"><div class="card"><div class="tablewrap"><table id="customTable"></table></div></div></section>

    <section id="tab-map" class="hidden"><div class="card">
      <p class="hint" data-t="map_hint" style="margin-top:0"></p>
      <canvas id="graph" style="width:100%;height:520px;background:var(--soft);border-radius:10px;touch-action:none"></canvas>
      <div id="graphInfo" class="hint" style="margin-top:6px"></div>
      <div id="tree" style="margin-top:12px;font-size:13px;max-height:420px;overflow:auto"></div>
    </div></section>

    <section id="tab-speed" class="hidden"><div class="card">
      <p class="hint" data-t="psi_hint" style="margin-top:0"></p>
      <div class="row"><select id="speedStrategy"><option value="mobile" data-t="mobile">Mobile</option><option value="desktop" data-t="desktop">Desktop</option></select>
        <input type="number" id="speedLimit" value="20" min="1" max="500" style="width:90px"> <span class="hint" data-t="pages_n">pages</span>
        <button type="button" id="speedBtn" data-t="run_speed">Check page speed</button> <span class="hint" id="speedStatus"></span></div>
      <div class="tablewrap" style="margin-top:12px"><table id="speedTable"></table></div>
    </div></section>

    <section id="tab-gsc" class="hidden"><div class="card">
      <p class="hint" data-t="gsc_hint" style="margin-top:0"></p>
      <div class="row"><input type="file" id="gscFile" accept=".zip,.csv"><button type="button" id="gscBtn" data-t="upload">Upload</button><span class="hint" id="gscStatus"></span></div>
      <div class="tablewrap" style="margin-top:12px"><table id="gscTable"></table></div>
    </div></section>

    <section id="tab-logs" class="hidden"><div class="card">
      <p class="hint" data-t="logs_hint" style="margin-top:0"></p>
      <div class="row"><input type="file" id="logFile"><button type="button" id="logBtn" data-t="upload">Upload</button><span class="hint" id="logStatus"></span></div>
      <div id="botSummary" style="margin-top:12px"></div>
      <div class="tablewrap" style="margin-top:12px"><table id="logTable"></table></div>
    </div></section>

    <section id="tab-schedules" class="hidden"><div class="card">
      <p class="hint" data-t="sched_hint" style="margin-top:0"></p>
      <div class="opts">
        <label><span data-t="every_days">Every (days)</span> <input type="number" id="schEvery" value="7" min="1"></label>
        <label><span data-t="telegram_chat">Telegram chat id</span> <input type="text" id="schChat"></label>
        <label><span data-t="email_to">E-mail to</span> <input type="text" id="schEmail"></label>
        <label><input type="checkbox" id="schOnly" checked> <span data-t="only_changes">Only when something got worse</span></label>
      </div>
      <div class="row" style="margin-top:10px"><button type="button" id="schAdd" data-t="add_schedule">Add schedule</button>
        <button type="button" class="ghost" id="schTest" data-t="test_alert">Send test alert</button><span class="hint" id="schStatus"></span></div>
      <div class="tablewrap" style="margin-top:12px"><table id="schTable"></table></div>
    </div></section>

    <section id="tab-report" class="hidden"><div class="card">
      <p class="hint" data-t="report_hint" style="margin-top:0"></p>
      <div class="row"><a id="reportOpen" target="_blank"><button type="button" class="ghost" data-t="open_report">Open report</button></a>
        <button type="button" id="reportPdf" data-t="pdf">Download PDF</button><span class="hint" id="reportStatus"></span></div>
    </div></section>

    <section id="tab-export" class="hidden">
      <div class="card">
        <p class="hint" data-t="export_hint" style="margin-top:0"></p>
        <div class="row" id="exportLinks"></div>
      </div>
    </section>
  </div>

  <footer><b>Free SEO Crawler — Made by Sachin Samria</b></footer>
</main>

<div class="modal hidden" id="modal"><div class="card" id="modalBody"></div></div>

<div class="modal hidden" id="settingsModal"><div class="card">
  <div class="row" style="justify-content:space-between"><b data-t="app_settings">Settings</b><button class="ghost" type="button" id="settingsClose" data-t="close">Close</button></div>
  <div class="opts" style="grid-template-columns:1fr">
    <label style="flex-direction:column;align-items:stretch"><span data-t="psi_key">PageSpeed API key</span><input type="text" id="s_psi_key"><small class="hint" data-t="psi_help"></small></label>
    <label style="flex-direction:column;align-items:stretch"><span data-t="telegram_token">Telegram bot token</span><input type="text" id="s_telegram_token"><small class="hint" data-t="telegram_help"></small></label>
    <b data-t="smtp" style="font-size:13px"></b>
    <div class="row"><input type="text" id="s_smtp_host" placeholder="smtp.gmail.com"><input type="text" id="s_smtp_port" placeholder="587" style="width:80px">
      <input type="text" id="s_smtp_user" placeholder="user"><input type="password" id="s_smtp_password" placeholder="password"><input type="text" id="s_smtp_from" placeholder="from"></div>
    <label><span data-t="alert_lang">Alert language</span> <select id="s_alert_lang"><option value="en">English</option><option value="hi">हिंदी</option></select></label>
    <b data-t="branding" style="margin-top:8px">Report branding</b>
    <div class="row"><label><span data-t="agency_name">Agency</span> <input type="text" id="s_agency_name"></label>
      <label><span data-t="agency_website">Website</span> <input type="text" id="s_agency_website"></label></div>
    <div class="row"><label><span data-t="client_name">Client</span> <input type="text" id="s_client_name"></label>
      <label><span data-t="brand_color">Colour</span> <input type="color" id="s_brand_color" value="#1f7a4d"></label>
      <label><span data-t="report_lang">Report language</span> <select id="s_report_lang"><option value="en">English</option><option value="hi">हिंदी</option></select></label></div>
    <div class="row"><span data-t="logo">Logo</span> <input type="file" id="s_logo" accept="image/*"><img id="logoPreview" style="max-height:40px"></div>
  </div>
  <div class="row" style="margin-top:12px"><button type="button" id="settingsSave" data-t="save">Save</button><span class="hint" id="settingsStatus"></span></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const ACTIVE = ["starting", "starting browser", "running", "analysing"];
let T = null, lang = "en", crawlId = null, crawls = [], pollTimer = null, summaryData = null, lastProgress = null;
let pageState = { view: "html", q: "", sort: "url", desc: false, page: 0, total: 0 };
try { lang = localStorage.getItem("seoLang") || "en"; } catch (e) {}

const t = key => T && T.ui[key] ? T.ui[key][lang === "hi" ? 1 : 0] : key;
const checkTitle = (code, fallback) => T && T.checks[code] ? T.checks[code][lang === "hi" ? 1 : 0] : fallback;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = ts => new Date(ts * 1000).toLocaleString();
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};

function applyLang() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll("[data-ph]")) el.placeholder = t(el.dataset.ph);
  $("langBtn").textContent = t("language");
  if (summaryData) renderSummary(summaryData);
  if (lastProgress) showProgress(lastProgress);
}

function showProgress(p) {
  lastProgress = p;
  const state = t(p.status === "running" ? "crawling" : p.status);
  $("progressText").textContent = `${state} — ${p.crawled} ${t("crawled")}, ${p.queued} ${t("queued")}, ` +
    `${(p.rate || 0).toFixed(1)} ${t("per_sec")}${p.current && p.status === "running" ? " — " + p.current : ""}` +
    (p.error ? " — " + p.error : "");
}
$("langBtn").onclick = () => {
  lang = lang === "hi" ? "en" : "hi";
  try { localStorage.setItem("seoLang", lang); } catch (e) {}
  applyLang();
};

// ------------------------------------------------------------ crawls

async function loadCrawls(select) {
  crawls = await api("/api/crawls");
  $("crawlsCard").classList.toggle("hidden", !crawls.length);
  $("crawlList").innerHTML = "";
  for (const c of crawls) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (c.id === crawlId ? " on" : "");
    b.textContent = `${c.start_url.replace(/^https?:\/\//, "")} · ${c.pages} · ${fmtTime(c.started)}`;
    b.onclick = () => openCrawl(c.id);
    $("crawlList").append(b);
  }
  for (const id of ["cmpA", "cmpB"]) {
    $(id).innerHTML = "";
    for (const c of crawls) $(id).add(new Option(`${c.start_url} — ${fmtTime(c.started)}`, c.id));
  }
  if (crawls.length > 1) $("cmpA").selectedIndex = 1;
  if (select && crawls.length) openCrawl(crawls[0].id);
}

$("startForm").onsubmit = async e => {
  e.preventDefault();
  try {
    const { id } = await api("/api/crawl", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value, max_pages: +$("maxPages").value, concurrency: +$("concurrency").value,
        respect_robots: $("robots").checked, check_external: $("external").checked, check_images: $("images").checked,
        use_sitemaps: $("sitemaps").checked, include_subdomains: $("subdomains").checked,
        render_js: $("renderJs").checked, accessibility: $("a11y").checked, custom: readRules() }) });
    crawlId = id;
    $("results").classList.add("hidden");
    await loadCrawls(false);
    watch(id);
  } catch (err) { alert(err.message); }
};
$("stopBtn").onclick = () => crawlId && fetch(`/api/crawl/${crawlId}/stop`, { method: "POST" });
$("deleteBtn").onclick = async () => {
  if (!crawlId || !confirm("Delete this crawl?")) return;
  try { await api(`/api/crawl/${crawlId}`, { method: "DELETE" }); } catch (err) { return alert(err.message); }
  crawlId = null; $("results").classList.add("hidden"); loadCrawls(true);
};

function watch(id) {
  clearInterval(pollTimer);
  $("progressBox").classList.remove("hidden");
  $("startBtn").disabled = true; $("stopBtn").classList.remove("hidden");
  const tick = async () => {
    const p = await api(`/api/crawl/${id}/progress`).catch(() => null);
    if (!p) return;
    const total = p.crawled + p.queued;
    $("bar").style.width = (total ? 100 * p.crawled / total : 5) + "%";
    showProgress(p);
    if (!ACTIVE.includes(p.status)) {
      clearInterval(pollTimer);
      $("startBtn").disabled = false; $("stopBtn").classList.add("hidden");
      $("bar").style.width = "100%";
      await loadCrawls(false);
      openCrawl(id);
    }
  };
  tick(); pollTimer = setInterval(tick, 1000);
}

async function openCrawl(id) {
  crawlId = id;
  for (const b of $("crawlList").children) b.classList.toggle("on", crawls[[...$("crawlList").children].indexOf(b)]?.id === id);
  const p = await api(`/api/crawl/${id}/progress`).catch(() => null);
  if (p && ACTIVE.includes(p.status)) return watch(id);
  summaryData = await api(`/api/crawl/${id}/summary`);
  $("results").classList.remove("hidden");
  renderSummary(summaryData);
  pageState.page = 0; loadPages();
  renderExport();
  const tab = document.querySelector(".tabs button.on").dataset.tab;
  if (tabLoaders[tab]) tabLoaders[tab]();
}

// ------------------------------------------------------------ overview

function bars(el, rows, label, cls) {
  const max = Math.max(1, ...rows.map(r => r.n));
  el.innerHTML = rows.map(r => `<div class="hbar"><span class="${cls ? cls(r) : ""}">${esc(label(r))}</span>` +
    `<span style="width:${100 * r.n / max}%"></span><span>${r.n}</span></div>`).join("") || "–";
}

function renderSummary(s) {
  const score = s.score;
  const color = score == null ? "var(--muted)" : score >= 90 ? "var(--accent)" : score >= 70 ? "var(--warn)" : "var(--err)";
  $("ring").textContent = score == null ? "–" : score + "%";
  $("ring").style.background = `conic-gradient(${color} ${(score || 0) * 3.6}deg, var(--soft) 0)`;
  $("ring").style.color = "var(--text)";
  const st = s.stats;
  $("tiles").innerHTML = [["html_pages", st.html_pages || 0], ["errors_n", st.errors || 0], ["redirects_n", st.redirects || 0],
    ["external_n", st.external_urls || 0], ["avg_time", st.avg_ms ? Math.round(st.avg_ms) + " ms" : "–"]]
    .map(([k, v]) => `<div class="tile"><b>${esc(v)}</b><small>${esc(t(k))}</small></div>`).join("");
  bars($("codes"), s.status_codes, r => r.status || "error", r => "code c" + String(r.status)[0]);
  bars($("depths"), s.depths, r => r.depth);
  const blocked = JSON.parse(s.meta.ai_bots_blocked || "[]");
  $("aiInfo").textContent = `${t("ai_ready")}: ` + (blocked.length ? "⚠ " + blocked.join(", ") : "✓") +
    ` · llms.txt ${JSON.parse(s.meta.llms_txt || "false") ? "✓" : "–"}` +
    (s.meta.renderer ? ` · ${t("rendered_with")}: ${s.meta.renderer}` : "") +
    (s.meta.render_error ? " · ⚠ JavaScript: " + s.meta.render_error.slice(0, 120) : "");
  $("topIssues").innerHTML = s.issues.length ? s.issues.slice(0, 12).map(i =>
    `<div class="hbar" style="grid-template-columns:1fr 60px"><span style="background:none;height:auto"><span class="sev ${i.severity}"></span>` +
    `${esc(lang === "hi" ? i.title_hi : i.title)}</span><span>${i.count}</span></div>`).join("") : esc(t("no_issues"));
  renderIssueList(s.issues);
}

// ------------------------------------------------------------ issues

function renderIssueList(issues) {
  const groups = ["error", "warning", "notice"];
  $("issueList").innerHTML = issues.length ? "" : esc(t("no_issues"));
  for (const g of groups) {
    const items = issues.filter(i => i.severity === g);
    if (!items.length) continue;
    const h = document.createElement("h4"); h.textContent = t(g); $("issueList").append(h);
    for (const i of items) {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = `<span class="sev ${g}"></span><span></span><em>${i.count}</em>`;
      b.children[1].textContent = lang === "hi" ? i.title_hi : i.title;
      b.onclick = () => { for (const x of $("issueList").querySelectorAll("button")) x.classList.remove("on"); b.classList.add("on"); showIssue(i); };
      $("issueList").append(b);
    }
  }
}

async function showIssue(i) {
  const rows = await api(`/api/crawl/${crawlId}/issues/${i.code}`);
  $("issueDetail").innerHTML = `<h3 style="margin:0 0 4px"><span class="sev ${i.severity}"></span></h3>

    <div class="tablewrap" style="margin-top:8px"><table><tbody></tbody></table></div>`;

// ------------------------------------------------------------ pages

const COLS = [["status", "Status"], ["url", "URL"], ["title", "Title"], ["link_score", "Link score"], ["words", "Words"], ["depth", "Depth"],
  ["time_ms", "ms"], ["size", "Size"]];

async function loadPages() {
  const ps = pageState;
  const qs = new URLSearchParams({ view: ps.view, q: ps.q, sort: ps.sort, desc: ps.desc ? 1 : 0, page: ps.page });
  const data = await api(`/api/crawl/${crawlId}/pages?${qs}`);
  ps.total = data.total;
  $("pageInfo").textContent = `${ps.page * data.per_page + (data.rows.length ? 1 : 0)}–${ps.page * data.per_page + data.rows.length} / ${data.total}`;
  $("prevBtn").disabled = ps.page === 0;
  $("nextBtn").disabled = (ps.page + 1) * data.per_page >= data.total;
  const head = "<tr>" + COLS.map(([k, n]) => `<th data-k="${k}">${n}${ps.sort === k ? (ps.desc ? " ▼" : " ▲") : ""}</th>`).join("") + "</tr>";
  $("pageTable").innerHTML = `<thead>${head}</thead><tbody></tbody>`;
  for (const th of $("pageTable").querySelectorAll("th")) th.onclick = () => {
    ps.desc = ps.sort === th.dataset.k ? !ps.desc : false; ps.sort = th.dataset.k; ps.page = 0; loadPages();
  };
  const tb = $("pageTable").querySelector("tbody");
  for (const r of data.rows) {
    const tr = document.createElement("tr"); tr.className = "click";
    const status = r.status || (r.error ? "ERR" : "–");
    const size = r.size ? (r.size > 1048576 ? (r.size / 1048576).toFixed(1) + " MB" : Math.round(r.size / 1024) + " KB") : "";
    for (const v of [status, r.url, r.title || r.redirect_to || r.error || "", r.link_score ?? "", r.words ?? "", r.depth ?? "", r.time_ms ?? "", size]) {
      const td = document.createElement("td"); td.textContent = v; tr.append(td);
    }
    tr.children[0].className = "code c" + String(r.status || 0)[0];
    tr.onclick = () => showPage(r.url);
    tb.append(tr);
  }
}
$("view").onchange = () => { pageState.view = $("view").value; pageState.page = 0; loadPages(); };
let qTimer; $("q").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { pageState.q = $("q").value; pageState.page = 0; loadPages(); }, 300); };
$("prevBtn").onclick = () => { pageState.page--; loadPages(); };
$("nextBtn").onclick = () => { pageState.page++; loadPages(); };

async function showPage(url) {
  const d = await api(`/api/crawl/${crawlId}/page?url=${encodeURIComponent(url)}`);
  const p = d.page;
  const fields = [["URL", p.url], ["Status", p.status || p.error], ["Title", p.title], ["Meta description", p.meta_desc],
    ["H1", (JSON.parse(p.h1 || "[]")).join(" | ")], ["Canonical", (JSON.parse(p.canonical || "[]")).join(" | ")],
    ["Robots", [p.meta_robots, p.x_robots].filter(Boolean).join(" / ")], ["Redirect to", p.redirect_to],
    ["Words", p.rendered ? `${p.words} (raw HTML: ${p.raw_words})` : p.words], ["Depth", p.depth], ["Response", p.time_ms != null ? p.time_ms + " ms" : ""],
    ["Language", p.lang], ["Found via", p.source]].filter(([, v]) => v !== null && v !== undefined && v !== "");
  $("modalBody").innerHTML = `<div class="row" style="justify-content:space-between"><b style="word-break:break-all"></b>
    <span><a target="_blank" rel="noopener">↗</a> &nbsp;<button class="ghost" type="button" id="closeModal">✕</button></span></div>
    <div class="kv" style="margin:12px 0"></div><b>${esc(t("page_issues"))}</b><div id="mIssues"></div>
    <div class="grid2" style="margin-top:12px"><div><b>${esc(t("inlinks"))} (${d.inlinks.length})</b><div class="tablewrap" style="max-height:260px"><table id="mIn"></table></div></div>
    <div><b>${esc(t("outlinks"))} (${d.outlinks.length})</b><div class="tablewrap" style="max-height:260px"><table id="mOut"></table></div></div></div>`;
  $("modalBody").querySelector("b").textContent = p.url;
  $("modalBody").querySelector("a").href = p.url;
  const kv = $("modalBody").querySelector(".kv");
  for (const [k, v] of fields) { const b = document.createElement("b"), s = document.createElement("span"); b.textContent = k; s.textContent = v; kv.append(b, s); }
  $("mIssues").innerHTML = d.issues.length ? "" : "✓";
  for (const i of d.issues) { const div = document.createElement("div"); div.innerHTML = `<span class="sev ${i.severity}"></span>`;
    div.append((lang === "hi" ? i.title_hi : i.title) + (i.detail ? " — " + i.detail : "")); $("mIssues").append(div); }
  for (const l of d.inlinks) { const tr = $("mIn").insertRow(); tr.insertCell().textContent = l.src; tr.insertCell().textContent = (l.anchor || "") + (l.nofollow ? " (nofollow)" : ""); }
  for (const l of d.outlinks) { const tr = $("mOut").insertRow(); const c = tr.insertCell(); c.textContent = l.status || ""; c.className = "code c" + String(l.status || 0)[0];
    tr.insertCell().textContent = l.dst; tr.insertCell().textContent = l.kind; }
  $("modal").classList.remove("hidden");
  $("closeModal").onclick = () => $("modal").classList.add("hidden");
}

document.addEventListener("keydown", e => { if (e.key === "Escape") $("modal").classList.add("hidden"); });

function fillTable(el, head, rows, cells, onRow) {
  el.innerHTML = "<thead><tr>" + head.map(h => `<th>${esc(h)}</th>`).join("") + "</tr></thead><tbody></tbody>";
  const tb = el.querySelector("tbody");
  for (const r of rows) {
    const tr = document.createElement("tr");
    for (const v of cells(r)) { const td = document.createElement("td"); td.textContent = v ?? ""; tr.append(td); }
    if (onRow) { tr.className = "click"; tr.onclick = () => onRow(r); }
    tb.append(tr);
  }
  if (!rows.length) tb.innerHTML = `<tr><td class="hint" colspan="${head.length}">–</td></tr>`;
}
const pct = v => v == null ? "" : (v * 100).toFixed(1) + "%";
const secs = v => v == null ? "" : (v / 1000).toFixed(1) + " s";

    const rows = await api(`/api/crawl/${crawlId}/custom`);

  async map() {
    const d = await api(`/api/crawl/${crawlId}/graph`);

  },

    fillTable($("speedTable"), ["Score", "URL", "LCP", "CLS", "INP", "TBT", ""], d.rows, r => {
      const f = JSON.parse(r.field || "{}");

// ------------------------------------------------------------ site map: force graph + folder tree

function drawGraph(nodes, edges) {
  const cv = $("graph"), dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const col = { ok: css.getPropertyValue("--accent"), bad: css.getPropertyValue("--err"), line: css.getPropertyValue("--line"), text: css.getPropertyValue("--text") };
  const idx = new Map(nodes.map((n, i) => [n.url, i]));
  const P = nodes.map((n, i) => ({ ...n, x: W / 2 + Math.cos(i) * (40 + i), y: H / 2 + Math.sin(i) * (40 + i), vx: 0, vy: 0,
    r: 3 + (n.link_score || 0) / 12 }));
  const E = edges.map(([a, b]) => [idx.get(a), idx.get(b)]).filter(([a, b]) => a != null && b != null);
  let drag = null, frames = 0;
  function step() {
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j]; let dx = a.x - b.x, dy = a.y - b.y; const d2 = dx * dx + dy * dy + 0.01;
      if (d2 > 40000) continue; const f = 120 / d2; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    }
    for (const [i, j] of E) { const a = P[i], b = P[j]; const dx = b.x - a.x, dy = b.y - a.y; a.vx += dx * 0.002; a.vy += dy * 0.002; b.vx -= dx * 0.002; b.vy -= dy * 0.002; }
    for (const p of P) { if (p === drag) continue; p.vx += (W / 2 - p.x) * 0.002; p.vy += (H / 2 - p.y) * 0.002;
      p.vx *= 0.82; p.vy *= 0.82; p.x = Math.max(8, Math.min(W - 8, p.x + p.vx)); p.y = Math.max(8, Math.min(H - 8, p.y + p.vy)); }
  }
  function paint() {
    ctx.clearRect(0, 0, W, H); ctx.strokeStyle = col.line; ctx.lineWidth = 0.6;
    for (const [i, j] of E) { ctx.beginPath(); ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(P[j].x, P[j].y); ctx.stroke(); }
    for (const p of P) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fillStyle = p.status === 200 ? col.ok : col.bad; ctx.fill(); }
    ctx.fillStyle = col.text; ctx.font = "11px system-ui";
    for (const p of P.slice(0, 12)) ctx.fillText(new URL(p.url).pathname.slice(0, 30), p.x + p.r + 3, p.y + 3);
  }
  (function loop() { step(); paint(); if (++frames < 400 || drag) requestAnimationFrame(loop); })();
  const at = e => { const b = cv.getBoundingClientRect(); const x = e.clientX - b.left, y = e.clientY - b.top;
    return P.find(p => (p.x - x) ** 2 + (p.y - y) ** 2 < (p.r + 4) ** 2); };
  cv.onpointerdown = e => { drag = at(e); if (drag) { frames = 0; $("graphInfo").textContent = `${drag.url} · ${t("link_score")} ${drag.link_score} · ${drag.title || ""}`; } };
  cv.onpointermove = e => { if (!drag) return; const b = cv.getBoundingClientRect(); drag.x = e.clientX - b.left; drag.y = e.clientY - b.top; };
  cv.onpointerup = () => { drag = null; };
  cv.ondblclick = e => { const p = at(e); if (p) showPage(p.url); };
}

function drawTree(rows) {
  const root = { kids: {}, n: 0, bad: 0 };
  for (const r of rows) {
    let node = root; node.n++; if (r.status !== 200) node.bad++;
    const u = new URL(r.url);
    for (const part of [u.host, ...u.pathname.split("/").filter(Boolean)]) {
      node = node.kids[part] = node.kids[part] || { kids: {}, n: 0, bad: 0 }; node.n++; if (r.status !== 200) node.bad++;
    }
  }
  const render = (node, depth) => Object.entries(node.kids).sort((a, b) => b[1].n - a[1].n).slice(0, 60).map(([name, k]) =>
    Object.keys(k.kids).length ? `<details ${depth < 1 ? "open" : ""} style="margin-left:${depth ? 14 : 0}px"><summary>📁 ${esc(name)} <span class="hint">${k.n}${k.bad ? ` · <span style="color:var(--err)">${k.bad} ⚠</span>` : ""}</span></summary>${render(k, depth + 1)}</details>`
      : `<div style="margin-left:${depth ? 28 : 0}px">📄 ${esc(name)}${k.bad ? ' <span style="color:var(--err)">⚠</span>' : ""}</div>`).join("");
  $("tree").innerHTML = render(root, 0);
}

api("/api/i18n").then(d => { T = d; applyLang(); loadCrawls(true); });
</script>
