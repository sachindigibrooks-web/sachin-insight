<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Raleway:wght@500;600&display=block" rel="stylesheet">
<style>
/* Mudras brand tokens, taken from mudras.com theme CSS */
:root{
  --gold:#F0CC75;        /* accent      hsl(42.44 80.39% 70%) */
  --black:#212121;       /* black       hsl(0 0% 12.94%) */
  --ink:#121212;         /* overlay base, near the site's hero black */
  --white:#FFFCF2;       /* white       hsl(46.15 100% 97.45%) */
  --serif:'Bellefair', serif;     /* stand-in for orpheus-pro (Adobe Fonts) */
  --sans:'Raleway', sans-serif;   /* site body font */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#555;padding:40px}
body.notext .t{visibility:hidden}
.ab{position:relative;overflow:hidden;background:var(--ink);color:var(--white)}
.li{width:1200px;height:627px}
.photo{position:absolute;top:0;bottom:0;right:0;background-repeat:no-repeat;background-size:cover;filter:grayscale(1) contrast(1.05) brightness(.95);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 38%);mask-image:linear-gradient(90deg,transparent 0%,#000 38%)}
.logo img{width:100%;display:block}
.serif{font-family:var(--serif);font-weight:400;line-height:1.14}
.rule{height:1px;background:var(--gold)}
</style></head><body>

<!-- LINKEDIN single image · 1200x627 -->
<div class="ab li" id="li_wellness">
  <div class="photo" style="left:520px;background-image:url(../../source/img/neck_myofascial.jpg);background-position:40% 52%"></div>
  <div class="logo t" style="position:absolute;left:120px;top:80px;width:200px"><img src="../../source/site/orig_Group_1487669750.png"></div>
  <div style="position:absolute;left:120px;top:236px;width:540px">
    <div class="rule" style="width:90px;margin-bottom:28px"></div>
    <div class="serif t" style="font-size:50px">Your wellness program<br>supports the mind.</div>
    <div class="serif t" style="font-size:50px;color:var(--gold);margin-top:18px">What about the body?</div>
  </div>
</div>

</body></html>
