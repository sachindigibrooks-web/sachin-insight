<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Raleway:wght@500;600&display=block" rel="stylesheet">
<style>
/* Mudras brand tokens, taken from mudras.com theme CSS */
:root{
  --gold:#F0CC75;        /* accent      hsl(42.44 80.39% 70%) */
  --ink:#121212;         /* overlay base, near the site's hero black */
  --white:#FFFCF2;       /* white       hsl(46.15 100% 97.45%) */
  --serif:'Bellefair', 'Noto Color Emoji', serif;   /* stand-in for orpheus-pro (Adobe Fonts) */
  --sans:'Raleway', sans-serif;                      /* site body font */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#555;padding:40px}
body.notext .t{visibility:hidden}
.ab{position:relative;overflow:hidden;background:var(--ink);color:var(--white)}
.p45{width:1080px;height:1350px}
/* lighter treatment than other posts so the studio photo reads natural */
.photo{position:absolute;left:0;right:0;background-repeat:no-repeat;background-size:cover;filter:grayscale(1) contrast(1.02) brightness(.95);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 80%,transparent 100%)}
.logo img{width:100%;display:block}
.serif{font-family:var(--serif);font-weight:400;line-height:1.12}
.kicker{font-family:var(--sans);font-weight:500;text-transform:uppercase;letter-spacing:.2em;color:var(--gold)}
.rule{height:1px;background:var(--gold)}
</style></head><body>

<!-- INSTAGRAM single image · 1080x1350 (4:5) -->
<div class="ab p45" id="ig_sports_vs_deep">
  <div class="photo" style="top:200px;height:780px;background-image:url(../img/runner_calf_mudras.jpg);background-position:45% 50%"></div>
  <div class="logo t" style="position:absolute;top:140px;left:50%;transform:translateX(-50%);width:280px"><img src="../site/orig_Group_1487669750.png"></div>
  <div style="position:absolute;left:120px;right:120px;top:930px">
    <div class="rule" style="width:120px;margin-bottom:32px"></div>
    <div class="serif t" style="font-size:76px">Runners: Sports<br>or Deep Tissue?</div>
    <div class="serif t" style="font-size:56px;color:var(--gold);margin-top:18px">Here&rsquo;s how to choose 👇</div>
  </div>
</div>

</body></html>
