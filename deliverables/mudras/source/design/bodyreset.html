<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Raleway:wght@500&display=block" rel="stylesheet">
<style>
/* Mudras brand tokens, taken from mudras.com theme CSS. Black/gold/white with the client's own black-and-white
   studio photo. Layout follows the brand's "The season starts before kickoff" post (thin gold inset frame,
   centred logo at the top), with the copy centred at the bottom over the dark foreground. */
:root{
  --gold:#F0CC75;        /* accent  hsl(42.44 80.39% 70%) */
  --white:#FFFCF2;       /* white   hsl(46.15 100% 97.45%) */
  --serif:'Bellefair', serif;     /* stand-in for orpheus-pro (Adobe Fonts) */
  --sans:'Raleway', sans-serif;   /* site body font */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start}
body.notext .t{visibility:hidden}
.ab{position:relative;overflow:hidden;background:#000;color:var(--white)}
.p45{width:1080px;height:1350px}
.photo{position:absolute;inset:0;background-repeat:no-repeat;background-size:cover;filter:grayscale(1) contrast(1.05) brightness(1.08)}
.shade{position:absolute;inset:0}
.serif{font-family:var(--serif);font-weight:400;line-height:1.04}
.caps{font-family:var(--sans);font-weight:500;text-transform:uppercase;letter-spacing:.24em}
.logo img{width:100%;display:block}
</style></head><body>

<div class="ab p45" id="fb_bodyreset">
  <div class="photo" style="background-image:url(../img/bodyreset_oil.jpg);background-position:50% 30%"></div>
  <div class="shade" style="background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 52%,rgba(0,0,0,.6) 68%,rgba(0,0,0,.85) 100%)"></div>
  <div style="position:absolute;inset:44px;border:1.5px solid var(--gold)"></div>
  <div class="logo t" style="position:absolute;left:50%;transform:translateX(-50%);top:135px;width:260px"><img src="../site/orig_Group_1487669750.png"></div>
  <div style="position:absolute;left:108px;right:108px;bottom:150px;text-align:center">
    <div class="serif t" style="font-size:104px">Not a Routine.</div>
    <div class="serif t" style="font-size:104px;color:var(--gold)">A Reset.</div>
    <div class="caps t" style="font-size:24px;margin-top:30px">Bespoke massage in Chelsea, NYC</div>
  </div>
</div>

</body></html>
