<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Raleway:wght@500&display=block" rel="stylesheet">
<style>
/* Mudras brand tokens, taken from mudras.com theme CSS.
   Split layout (photo over a solid darkAccent panel) so it reads differently from the full-bleed posts. */
:root{
  --gold:#F0CC75;        /* accent      hsl(42.44 80.39% 70%) */
  --green:#1F2C1B;       /* darkAccent  from site.css */
  --white:#FFFCF2;       /* white       hsl(46.15 100% 97.45%) */
  --serif:'Bellefair', serif;     /* stand-in for orpheus-pro (Adobe Fonts) */
  --sans:'Raleway', sans-serif;   /* site body font */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start}
body.notext .t{visibility:hidden}
.ab{position:relative;overflow:hidden;background:var(--green);color:var(--white)}
.p45{width:1080px;height:1350px}
.photo{position:absolute;left:0;right:0;top:0;background-repeat:no-repeat;background-size:cover;filter:saturate(.6) contrast(1.04)}
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--green)}
.serif{font-family:var(--serif);font-weight:400;line-height:1.08}
.kicker{font-family:var(--sans);font-weight:500;text-transform:uppercase;letter-spacing:.22em;color:var(--gold)}
.logo img{width:100%;display:block}
</style></head><body>

<div class="ab p45" id="ig_corp_nov">
  <div class="photo" style="height:780px;background-image:url(../img/corp_planner.jpg);background-position:40% 30%"></div>
  <div class="panel" style="top:780px;border-top:3px solid var(--gold)"></div>
  <div style="position:absolute;left:108px;right:108px;top:860px">
    <div class="kicker t" style="font-size:26px">Corporate Bodywork &middot; NYC</div>
    <div class="serif t" style="font-size:88px;margin-top:28px">Book your team<br>wellness day now</div>
  </div>
  <div class="logo t" style="position:absolute;right:108px;bottom:135px;width:250px"><img src="../site/orig_Group_1487669750.png"></div>
</div>

</body></html>
