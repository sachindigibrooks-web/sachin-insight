<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Raleway:wght@500;600&display=block" rel="stylesheet">
<style>
/* Mudras brand tokens, taken from mudras.com theme CSS. Black/gold/white with black-and-white photos.
   Creative: a split comparison. The top band (deep tissue) carries a gold arrow pressing down; the bottom band
   (myofascial release) carries a gold arrow moving across; a gold hairline divides them. Hands only, no tools. */
:root{
  --gold:#F0CC75;        /* accent  hsl(42.44 80.39% 70%) */
  --white:#FFFCF2;       /* white   hsl(46.15 100% 97.45%) */
  --serif:'Bellefair', serif;     /* stand-in for orpheus-pro (Adobe Fonts) */
  --sans:'Raleway', sans-serif;   /* site body font */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start}
body.notext .t{visibility:hidden}
.ab{position:relative;overflow:hidden;background:#000;color:var(--white)}
.p45{width:1080px;height:1350px}
.band{position:absolute;left:0;right:0;background-repeat:no-repeat;background-size:cover;filter:grayscale(1) contrast(1.08) brightness(.9)}
.serif{font-family:var(--serif);font-weight:400;line-height:1.06}
.caps{font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:.26em;color:var(--gold)}
.logo img{width:100%;display:block}
svg.arrows{position:absolute;inset:0}
</style></head><body>

<div class="ab p45" id="fb_dt_vs_mf">
  <!-- top band: deep tissue -->
  <div class="band" style="top:0;height:640px;background-image:url(../../img/mf_glide.jpg);background-position:50% 42%"></div>
  <div style="position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 52%,rgba(0,0,0,.82) 100%)"></div>
  <div style="position:absolute;left:0;top:0;width:640px;height:400px;background:radial-gradient(ellipse 420px 220px at 32% 42%,rgba(0,0,0,.82),rgba(0,0,0,0))"></div>
  <!-- bottom band: myofascial -->
  <div class="band" style="top:643px;height:707px;background-image:url(../../img/dt_press.jpg);background-size:1080px auto;background-position:50% 74%"></div>
  <div style="position:absolute;left:0;right:0;top:643px;height:707px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.25) 18%,rgba(0,0,0,.78) 40%,rgba(0,0,0,.9) 100%)"></div>
  <div style="position:absolute;left:0;right:0;top:640px;height:3px;background:var(--gold)"></div>

  <div class="logo t" style="position:absolute;left:108px;top:135px;width:220px"><img src="../../site/orig_Group_1487669750.png"></div>
  <div style="position:absolute;left:108px;right:108px;top:500px">
    <div class="caps t" style="font-size:24px;display:inline-block;background:rgba(0,0,0,.72);padding:12px 18px 10px">Deep tissue</div>
  </div>
  <div style="position:absolute;left:108px;right:108px;top:920px">
    <div class="caps t" style="font-size:24px">Myofascial release</div>
    <div class="serif t" style="font-size:74px;margin-top:22px">Different Techniques.<br><span style="color:var(--gold)">One Individualized Session.</span></div>
  </div>
</div>

</body></html>
