<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Raleway:wght@500;600&display=block" rel="stylesheet">
<style>
/* Mudras brand tokens, taken from mudras.com theme CSS */
:root{
  --gold:#F0CC75;        /* accent      hsl(42.44 80.39% 70%) */
  --ink:#121212;         /* overlay base, near the site's hero black */
  --white:#FFFCF2;       /* white       hsl(46.15 100% 97.45%) */
  --serif:'Bellefair', serif;     /* stand-in for orpheus-pro (Adobe Fonts) */
  --sans:'Raleway', sans-serif;   /* site body font */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#555;padding:40px}
body.notext .t{visibility:hidden}
.ab{position:relative;overflow:hidden;background:var(--ink);color:var(--white)}
.p45{width:1080px;height:1350px}
.photo{position:absolute;left:0;right:0;background-repeat:no-repeat;background-size:cover;filter:grayscale(1) contrast(1.05) brightness(.72);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 75%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 75%,transparent 100%)}
.logo img{width:100%;display:block}
.serif{font-family:var(--serif);font-weight:400;line-height:1.14}
.kicker{font-family:var(--sans);font-weight:500;text-transform:uppercase;letter-spacing:.2em;color:var(--gold)}
.rule{height:1px;background:var(--gold)}
</style></head><body>

<!-- LINKEDIN single image · 1080x1350 (4:5 portrait) -->
<div class="ab p45" id="li_wellness_45">
  <div class="photo" style="top:200px;height:760px;background-image:url(../../img/office_back.jpg);background-position:50% 40%"></div>
  <div class="logo t" style="position:absolute;top:140px;left:50%;transform:translateX(-50%);width:280px"><img src="../../site/orig_Group_1487669750.png"></div>
  <div style="position:absolute;left:120px;right:120px;top:900px">
    <div class="rule" style="width:120px;margin-bottom:36px"></div>
    <div class="serif t" style="font-size:72px">Make Physical Wellbeing</div>
    <div class="serif t" style="font-size:72px;color:var(--gold);margin-top:16px">Part of the Workday.</div>
  </div>
</div>

</body></html>
