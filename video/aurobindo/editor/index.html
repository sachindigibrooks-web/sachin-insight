<meta charset="utf-8">
<title>Aurobindo Timeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an NLE in one dark room. Viewer + inspector on top, a stacked multi-track timeline below; colours come from the film's own palette. */
:root {
	--ink: #0d0c0a; --panel: #161411; --panel2: #1e1b17; --line: #2c2822; --line2: #3a352d;
	--text: #efe7d8; --dim: #958b7a; --faint: #5f584c;
	--gold: #f2b84b; --coral: #ff6a4d; --teal: #3f8f96; --sage: #8fa36b; --ivory: #f6efe3; --lilac: #a691c9;
	--display: 'Anton', 'Impact', 'Arial Narrow', sans-serif;
	--ui: 'Barlow', 'Segoe UI', system-ui, sans-serif;
	--cond: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
	--mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
	--head: 132px;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 14px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden;
	padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--dim); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .clip:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
button.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
button:disabled { opacity: .4; cursor: default; }
.icon { width: 32px; height: 30px; padding: 0; display: inline-grid; place-items: center; }
.icon svg { width: 14px; height: 14px; fill: currentColor; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand b { font: 22px/1 var(--display); letter-spacing: .02em; color: var(--ivory); }
.brand span { font: 500 12px var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group { display: flex; align-items: center; gap: 4px; }
.tc { font: 600 20px var(--mono); font-variant-numeric: tabular-nums; color: var(--gold); padding: 0 8px; min-width: 112px; text-align: center; }
.tc small { font-size: 11px; color: var(--dim); font-weight: 400; display: block; letter-spacing: .1em; }
.lbl { font: 500 11px var(--cond); text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
input[type=range] { accent-color: var(--gold); width: 110px; }
.dirty { font: 500 12px var(--cond); letter-spacing: .08em; color: var(--coral); text-transform: uppercase; }

/* viewer + inspector */
.top { display: flex; gap: 0; min-height: 0; flex: 0 0 auto; height: 42vh; border-bottom: 1px solid var(--line); }
.viewer { flex: 1 1 auto; display: grid; place-items: center; background: #000; position: relative; min-width: 0; }
.viewer video { height: calc(42vh - 16px); max-width: 100%; aspect-ratio: 9/16; background: #000; display: block; }
.viewer .now { position: absolute; left: 12px; bottom: 10px; font: 500 12px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; flex-direction: column; gap: 2px; max-width: calc(50% - 160px); }
.viewer .now b { color: var(--text); font-weight: 600; }
.viewer .cap { position: absolute; right: 12px; bottom: 10px; font: 600 14px var(--ui); color: var(--ivory); text-align: right; max-width: calc(50% - 160px); }
.loading { position: absolute; inset: auto 12px 12px auto; }
.inspector { flex: 0 0 340px; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.inspector h2 { margin: 0; font: 500 11px var(--cond); text-transform: uppercase; letter-spacing: .14em; color: var(--dim); }
.inspector h3 { margin: 0; font: 600 18px var(--ui); text-wrap: balance; overflow-wrap: anywhere; }
.chip { display: inline-block; font: 600 11px var(--cond); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--line2); color: var(--dim); }
.chip.changed { color: var(--coral); border-color: var(--coral); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fields .wide { grid-column: 1 / -1; }
.fields input[type=number], .fields input[type=text], .fields textarea, .fields select { background: var(--ink); border: 1px solid var(--line2); border-radius: 4px; padding: 6px 8px; width: 100%; font-variant-numeric: tabular-nums; }
.fields input[type=range] { width: 100%; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
.kbd { font: 12px var(--mono); color: var(--dim); display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.kbd span:nth-child(odd) { color: var(--text); }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* timeline */
.tl { flex: 1 1 auto; overflow: auto; position: relative; background: var(--ink); min-height: 0; overscroll-behavior: contain; }
.tl-inner { position: relative; }
.trow { display: flex; border-bottom: 1px solid var(--line); }
.thead { position: sticky; left: 0; z-index: 6; flex: 0 0 var(--head); width: var(--head); background: var(--panel); border-right: 1px solid var(--line); padding: 4px 8px; display: flex; align-items: center; gap: 6px; }
.thead .name { font: 600 13px var(--cond); letter-spacing: .08em; text-transform: uppercase; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thead .sw { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
.thead button { padding: 0; width: 22px; height: 20px; font: 600 11px var(--cond); }
.lane { position: relative; flex: 0 0 auto; }
.ruler { position: sticky; top: 0; z-index: 8; background: var(--panel); }
.ruler .thead { z-index: 9; }
.phr { position: absolute; top: 0; height: 44px; width: 1px; background: var(--coral); pointer-events: none; }
.phr::before { content: ''; position: absolute; top: 0; left: -6px; border: 6px solid transparent; border-top: 8px solid var(--coral); }
.ruler canvas, .lane canvas { display: block; }
.clip { position: absolute; border-radius: 3px; overflow: hidden; cursor: grab; font: 500 12px/1.2 var(--cond); padding: 3px 6px; white-space: nowrap; text-overflow: ellipsis; color: var(--ink); border: 1px solid rgba(0,0,0,.35); touch-action: none; user-select: none; }
.clip.sel { box-shadow: 0 0 0 2px var(--ivory); z-index: 2; }
.clip.muted { opacity: .35; }
.clip.changed::after { content: ''; position: absolute; right: 3px; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 1.5px var(--ink); }
.clip canvas { position: absolute; left: 0; bottom: 0; pointer-events: none; opacity: .28; }
[hidden] { display: none !important; }
.clip span { position: relative; font-weight: 600; }
.clip .h { position: absolute; top: 0; bottom: 0; width: 6px; cursor: ew-resize; }
.clip .h.l { left: 0; } .clip .h.r { right: 0; }
.playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--coral); z-index: 5; pointer-events: none; }
.snapline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ivory); opacity: .7; z-index: 5; pointer-events: none; }

/* export */
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 6px; width: min(860px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.dlg header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.dlg h2 { margin: 0; font: 22px var(--display); letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.dlg textarea { width: 100%; height: 46vh; background: var(--ink); border: 1px solid var(--line2); border-radius: 4px; font: 12px/1.5 var(--mono); padding: 10px; resize: vertical; white-space: pre; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ivory); color: var(--ink); font-weight: 600; padding: 8px 14px; border-radius: 4px; z-index: 50; }

@media (max-width: 760px) {
	body { overflow: auto; }
	.top { flex-direction: column; height: auto; }
	.viewer video { height: 52vh; }
	.viewer .now, .viewer .cap { display: none; }
	.inspector { flex: 0 0 auto; border-left: 0; border-top: 1px solid var(--line); }
	.tl { flex: 0 0 auto; height: 60vh; }
	:root { --head: 96px; }
	.tc { font-size: 17px; min-width: 96px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="bar">
	<div class="brand"><b>SRI AUROBINDO</b><span>Consciousness · 1080×1920 · 30 fps · 53.5 s</span></div>
	<div class="group" role="group" aria-label="Transport">
		<button class="icon" id="bHome" title="Go to start (Home)" aria-label="Go to start"><svg viewBox="0 0 16 16"><path d="M2 2h2v12H2zM14 2v12L5 8z"/></svg></button>
		<button class="icon" id="bPrev" title="Previous beat (Shift+Left)" aria-label="Previous beat"><svg viewBox="0 0 16 16"><path d="M8 8l7-6v12zM1 8l7-6v12z"/></svg></button>
		<button class="icon" id="bPlay" title="Play / pause (Space)" aria-label="Play"><svg viewBox="0 0 16 16" id="playIco"><path d="M3 1l12 7-12 7z"/></svg></button>
		<button class="icon" id="bNext" title="Next beat (Shift+Right)" aria-label="Next beat"><svg viewBox="0 0 16 16"><path d="M8 8L1 2v12zm7 0L8 2v12z"/></svg></button>
		<div class="tc" id="tc" aria-live="off">00:00:00<small id="tcSec">0.000 s</small></div>
	</div>
	<div class="group"><span class="lbl">Zoom</span><input type="range" id="zoom" min="0" max="100" value="0" aria-label="Timeline zoom"></div>
	<div class="group">
		<button id="bSnap" class="on" title="Snap to beats, words and edges (S)">Snap</button>
		<button id="bLoop" title="Loop the selected item (L)">Loop</button>
		<button class="icon" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M5 3L1 7l4 4V8h5a3 3 0 010 6H7v2h3a5 5 0 000-10H5z"/></svg></button>
		<button class="icon" id="bRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="M11 3l4 4-4 4V8H6a3 3 0 000 6h3v2H6A5 5 0 016 6h5z"/></svg></button>
	</div>
	<span class="dirty" id="dirty" hidden></span>
	<button id="bExport">Export</button>
</div>

<div class="top">
	<div class="viewer">
		<video id="vid" muted playsinline preload="auto"><source src="data/proxy.mp4" type="video/mp4"><source src="data/proxy.webm" type="video/webm"></video>
		<div class="now" id="now"></div>
		<div class="cap" id="cap"></div>
		<span class="chip loading" id="loading">Loading audio 0%</span>
	</div>
	<aside class="inspector" id="insp" aria-label="Inspector"></aside>
</div>

<div class="tl" id="tl"><div class="tl-inner" id="tlInner"></div></div>

<dialog id="dlg"><div class="dlg">
	<header><h2>Export</h2><div class="tabs" id="tabs">
		<button data-k="json" class="on">Edit list (JSON)</button>
		<button data-k="xml">Premiere / Resolve XML</button>
		<button data-k="py">mix2.py cues</button>
		<button data-k="csv">Cue sheet (CSV)</button>
	</div></header>
	<p class="note" id="expNote"></p>
	<textarea id="expText" readonly spellcheck="false" aria-label="Export text"></textarea>
	<div class="row-actions"><button id="bCopy" class="on">Copy</button><button id="bClose">Close</button></div>
</div></dialog>

<script src="xmeml.js"></script>
<script>
(() => {
const $ = (id) => document.getElementById(id);
const db = (x) => Math.pow(10, x / 20);
const r3 = (x) => Math.round(x * 1000) / 1000;
const COLORS = { scene: '#3a352d', broll: '#3f8f96', photo: '#f6efe3', gfx: '#ff6a4d', title: '#f2b84b', note: '#d9c9a3', caption: '#8f8676', voice: '#f6efe3', music: '#3f8f96', tanpura: '#8fa36b', sfx: '#ff6a4d' };
const SCENE_TONE = { hook: '#4a2b26', intro: '#3d3322', ladder: '#24363a', super: '#43381f', story: '#2f2a24', practice: '#2b3624', end: '#3a2f3e' };
const SAVE_KEY = 'aurobindo-timeline-edits-v1';

let P, ORIG, FPS, DUR;
let pps = 20, snap = true, loop = false, sel = null;
let undo = [], redo = [];
const audio = { ctx: null, buf: {}, ready: false, playing: false, t0: 0, when: 0, nodes: [], tracks: {} };
const trackState = { voice: { m: false, s: false }, music: { m: false, s: false }, tanpura: { m: false, s: false }, sfx: { m: false, s: false } };
let playT = 0;

/* ---------------- data ---------------- */
fetch('data/project.json').then((r) => r.json()).then((p) => {
	ORIG = JSON.parse(JSON.stringify(p));
	P = p; FPS = p.fps; DUR = p.duration;
	P.captions = p.pages.map((pg, i) => ({ id: 'cap' + (i + 1), label: pg.words.map((w) => w.t).join(' '), s: pg.s, e: pg.e }));
	ORIG.captions = JSON.parse(JSON.stringify(P.captions));
	restore();
	fitZoom();
	render();
	loadAudio();
}).catch(() => { $('insp').innerHTML = '<p class="note">The timeline data did not load. Open this page from the editor folder so data/project.json sits next to it.</p>'; });

const editable = () => ({ video: P.video.map((t) => t.items), sfx: P.sfx, captions: P.captions });
function snapshot() { return JSON.stringify({ video: P.video.map((t) => t.items), sfx: P.sfx, captions: P.captions, audio: P.audio.map((a) => a.muted || false) }); }
function apply(s) {
	const o = JSON.parse(s);
	P.video.forEach((t, i) => (t.items = o.video[i]));
	P.sfx = o.sfx; P.captions = o.captions;
	P.audio.forEach((a, i) => (a.muted = o.audio[i]));
}
function commit(before) {
	if (before === snapshot()) return;
	undo.push(before); redo = [];
	if (undo.length > 200) undo.shift();
	save(); render(); if (audio.playing) restartAudio();
}
function save() { try { localStorage.setItem(SAVE_KEY, snapshot()); } catch (e) {} }
function restore() {
	try { const s = localStorage.getItem(SAVE_KEY); if (s) apply(s); } catch (e) {}
}

const allItems = () => [...P.video.flatMap((t) => t.items.map((it) => [t.key, it])), ...P.sfx.map((c) => ['sfx', c]), ...P.captions.map((c) => ['caption', c])];
function origOf(kind, id) {
	if (kind === 'sfx') return ORIG.sfx.find((c) => c.id === id);
	if (kind === 'caption') return ORIG.captions.find((c) => c.id === id);
	for (const t of ORIG.video) { const f = t.items.find((x) => x.id === id); if (f) return f; }
	return null;
}
function isChanged(kind, it) {
	const o = origOf(kind, it.id);
	if (!o) return true;
	return Math.abs(o.s - it.s) > 1e-4 || Math.abs(o.e - it.e) > 1e-4 || o.label !== it.label || (o.gain ?? 0) !== (it.gain ?? 0) || !!it.muted !== !!o.muted || (o.trim ?? 0) !== (it.trim ?? 0) || (it.offset || 0) !== (o.offset || 0);
}
function find(kind, id) { return allItems().find(([k, it]) => k === kind && it.id === id)?.[1]; }

/* ---------------- time helpers ---------------- */
function tc(t) {
	const f = Math.round(t * FPS), s = Math.floor(f / FPS), m = Math.floor(s / 60);
	return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`;
}
const frame = (t) => Math.round(t * FPS) / FPS;
function snapPoints(exclude) {
	const pts = [0, DUR, playT, ...Object.values(P.beats), ...P.scenes.flatMap((s) => [s.s, s.e])];
	P.pages.forEach((pg) => pg.words.forEach((w) => pts.push(w.s, w.e)));
	allItems().forEach(([k, it]) => { if (it !== exclude) pts.push(it.s, it.e); });
	return pts;
}
function snapT(t, exclude) {
	if (!snap) return { t: frame(t), hit: null };
	let best = null, bd = 7 / pps;
	for (const p of snapPoints(exclude)) { const d = Math.abs(p - t); if (d < bd) { bd = d; best = p; } }
	return best === null ? { t: frame(t), hit: null } : { t: best, hit: best };
}

/* ---------------- layout ---------------- */
function lanes(items) {
	const out = [];
	[...items].sort((a, b) => a.s - b.s).forEach((it) => {
		let i = out.findIndex((l) => l[l.length - 1].e <= it.s + 1e-6);
		if (i < 0) { out.push([]); i = out.length - 1; }
		out[i].push(it);
	});
	return out;
}
function fitZoom() {
	const w = $('tl').clientWidth - parseInt(getComputedStyle(document.documentElement).getPropertyValue('--head')) - 24;
	pps = Math.max(8, w / DUR);
	$('zoom').value = 0;
}
const zoomToPps = (v) => { const min = Math.max(8, ($('tl').clientWidth - 160) / DUR); return min * Math.pow(400 / min, v / 100); };

/* ---------------- render ---------------- */
function head(name, color, controls = '') {
	return `<div class="thead"><span class="sw" style="background:${color}"></span><span class="name" title="${name}">${name}</span>${controls}</div>`;
}
function render() {
	const W = Math.ceil(DUR * pps) + 40;
	const inner = $('tlInner');
	const keepScroll = $('tl').scrollLeft;
	let h = '';
	h += `<div class="trow ruler">${head('Timeline', 'transparent')}<div class="lane" style="width:${W}px;height:44px"><canvas id="cRuler" width="${W}" height="44"></canvas><div class="phr" id="phr"></div></div></div>`;
	h += `<div class="trow">${head('Picture', '#000')}<div class="lane" style="width:${W}px;height:52px"><canvas id="cFilm" width="${W}" height="52"></canvas></div></div>`;
	h += row('Scenes', 'scene', [P.scenes.map((s, i) => ({ id: 'scene' + i, label: s.id, s: s.s, e: s.e, fixed: true }))], 24);
	const vk = { broll: 'B-roll', photo: 'Photos', gfx: 'Graphics', title: 'Titles', note: 'Hand notes' };
	P.video.forEach((t) => (h += row(vk[t.key], t.key, lanes(t.items), 26)));
	h += row('Captions', 'caption', lanes(P.captions), 24);
	P.audio.forEach((a) => {
		const st = trackState[a.key];
		const ctl = `<button data-ms="${a.key}" data-f="m" class="${st.m ? 'on' : ''}" title="Mute ${a.name}" aria-label="Mute ${a.name}">M</button><button data-ms="${a.key}" data-f="s" class="${st.s ? 'on' : ''}" title="Solo ${a.name}" aria-label="Solo ${a.name}">S</button>`;
		h += `<div class="trow">${head(a.name, COLORS[a.key], ctl)}<div class="lane" style="width:${W}px;height:44px"><canvas data-wave="${a.key}" width="${W}" height="44"></canvas></div></div>`;
	});
	const st = trackState.sfx;
	const sctl = `<button data-ms="sfx" data-f="m" class="${st.m ? 'on' : ''}" title="Mute SFX" aria-label="Mute SFX">M</button><button data-ms="sfx" data-f="s" class="${st.s ? 'on' : ''}" title="Solo SFX" aria-label="Solo SFX">S</button>`;
	h += row('SFX', 'sfx', lanes(P.sfx), 30, sctl);
	h += `<div class="playhead" id="ph"></div><div class="snapline" id="snapline" hidden></div>`;
	inner.innerHTML = h;
	inner.style.width = W + parseInt(getComputedStyle(document.documentElement).getPropertyValue('--head')) + 'px';
	$('tl').scrollLeft = keepScroll;
	drawRuler(); drawFilm(); drawWaves(); drawClipWaves();
	updatePlayhead(); updateDirty(); inspector();
}
function row(name, kind, laneList, hgt, ctl = '') {
	const W = Math.ceil(DUR * pps) + 40;
	const n = Math.max(1, laneList.length);
	let clips = '';
	laneList.forEach((lane, li) => lane.forEach((it) => {
		const x = it.s * pps, w = Math.max(3, (it.e - it.s) * pps);
		const bg = kind === 'scene' ? SCENE_TONE[it.label] : COLORS[kind];
		const fg = kind === 'scene' || kind === 'caption' ? 'var(--text)' : 'var(--ink)';
		const cls = ['clip', sel && sel.id === it.id ? 'sel' : '', it.muted ? 'muted' : '', !it.fixed && isChanged(kind, it) ? 'changed' : ''].join(' ');
		const label = kind === 'sfx' ? `${it.label} ${it.gain > 0 ? '+' : ''}${it.gain} dB` : kind === 'scene' ? it.label.toUpperCase() : it.label;
		clips += `<div class="${cls}" tabindex="0" data-kind="${kind}" data-id="${it.id}" style="left:${x}px;top:${li * hgt + 2}px;width:${w}px;height:${hgt - 4}px;background:${bg};color:${fg}" title="${label.replace(/"/g, '&quot;')} · ${it.s.toFixed(2)}–${it.e.toFixed(2)} s">`
			+ (kind === 'sfx' ? `<canvas data-cw="${it.id}" width="${Math.ceil(w)}" height="${hgt - 4}"></canvas>` : '')
			+ `<span>${label}</span>${it.fixed ? '' : '<i class="h l"></i><i class="h r"></i>'}</div>`;
	}));
	return `<div class="trow">${head(name, kind === 'scene' ? 'var(--line2)' : COLORS[kind], ctl)}<div class="lane" style="width:${W}px;height:${n * hgt}px">${clips}</div></div>`;
}
function drawRuler() {
	const c = $('cRuler'), g = c.getContext('2d');
	g.clearRect(0, 0, c.width, c.height);

$('bLoop').onclick = () => { loop = !loop; $('bLoop').classList.toggle('on', loop); };
$('bUndo').onclick = () => { if (!undo.length) return; redo.push(snapshot()); apply(undo.pop()); save(); render(); if (audio.playing) restartAudio(); };
$('bRedo').onclick = () => { if (!redo.length) return; undo.push(snapshot()); apply(redo.pop()); save(); render(); if (audio.playing) restartAudio(); };
document.addEventListener('keydown', (e) => {
	if (e.target.closest('input, textarea, select, dialog')) return;
	const k = e.key;
	if (k === ' ') { e.preventDefault(); audio.playing ? pause() : play(); }
	else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? $('bPrev').click() : seek(playT - 1 / FPS); }
	else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? $('bNext').click() : seek(playT + 1 / FPS); }
	else if (k === 'Home') seek(0);
	else if (k === 'End') seek(DUR);
	else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? $('bRedo').click() : $('bUndo').click(); }
	else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'y') { e.preventDefault(); $('bRedo').click(); }
	else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'd') { e.preventDefault(); if (sel && sel.kind === 'sfx') duplicate(find('sfx', sel.id)); }
	else if ((k === 'Delete' || k === 'Backspace') && sel && sel.kind === 'sfx') { const it = find('sfx', sel.id); const b = snapshot(); it.muted = !it.muted; commit(b); }
	else if (k === '+' || k === '=') setZoom(+$('zoom').value + 10);
	else if (k === '-') setZoom(+$('zoom').value - 10);
	else if (k.toLowerCase() === 's' && !e.ctrlKey && !e.metaKey) $('bSnap').click();
	else if (k.toLowerCase() === 'l') $('bLoop').click();
	else if (k === 'Escape') { sel = null; render(); }
});

/* ---------------- export ---------------- */
let expKind = 'json';
function exportText(kind) {
	const changed = allItems().filter(([k, it]) => isChanged(k, it));
	if (kind === 'json') {
		$('expNote').textContent = changed.length ? `${changed.length} changed item${changed.length === 1 ? '' : 's'}. Paste this into the chat and Claude applies it to scenes.tsx and mix2.py, then re-renders.` : 'No changes yet. The full timeline is below; move something and it shows up under "changes".';
		return JSON.stringify({
			project: 'video/aurobindo', render: P.render,
			changes: changed.map(([k, it]) => { const o = origOf(k, it.id); return { track: k, id: it.id, label: it.label, line: it.line, was: o ? { s: o.s, e: o.e, label: o.label, gain: o.gain } : 'new', now: { s: it.s, e: it.e, label: it.label, gain: it.gain, muted: !!it.muted, offset: it.offset, trim: it.trim } }; }),
			timeline: { video: P.video.map((t) => ({ track: t.key, items: t.items.map(({ id, label, s, e, trim, src }) => ({ id, label, s, e, trim, src })) })), captions: P.captions, sfx: P.sfx.map(({ id, label, file, s, e, gain, muted, offset }) => ({ id, label, file, s, e, gain, muted: !!muted, offset })) },
		}, null, 2);
	}
	if (kind === 'xml') {
		$('expNote').textContent = 'Final Cut 7 XML for Premiere Pro (File > Import) or DaVinci Resolve (File > Import > Timeline). Save it inside video/aurobindo and relink once to that folder. Tracks: B-roll lanes, the final render on top as reference, voice, music, tanpura and every SFX cue as its own clip with its level.';
		return buildXML(P);
	}
	if (kind === 'py') {
		$('expNote').textContent = 'Sound-effect cues as put() lines in mix2.py form (times are absolute seconds). Muted cues are left out.';
		return P.sfx.filter((c) => !c.muted).sort((a, b) => a.s - b.s).map((c) => {
			const name = c.label.includes('(synth)') ? c.label.split(' ')[0] + '()' : `'${c.label}'`;
			const parts = [c.s.toFixed(3), name, c.gain];
			if (c.src_start || c.offset) parts.push(`start=${r3((c.src_start || 0) + (c.offset || 0) * (c.rate || 1))}`);
			if (Math.abs((c.e - c.s) - c.len) > 0.01) parts.push(`dur=${r3((c.e - c.s) * (c.rate || 1))}`);
			if (c.fin) parts.push(`fin=${c.fin}`);
			if (c.fout !== 0.05) parts.push(`fout=${c.fout}`);
			if (c.rate !== 1) parts.push(`rate=${c.rate}`);
			return `put(${parts.join(', ')})${isChanged('sfx', c) ? '  # edited' : ''}`;
		}).join('\n');
	}
	$('expNote').textContent = 'Every element on the timeline, one row each, for a spreadsheet or a sound-design review.';
	const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
	return ['track,id,label,start_s,end_s,start_tc,level_db,muted,changed', ...allItems().map(([k, it]) => [k, it.id, q(it.label), it.s.toFixed(3), it.e.toFixed(3), tc(it.s), it.gain ?? '', !!it.muted, isChanged(k, it)].join(','))].join('\n');
}
function showExport(kind) {
	expKind = kind;
	document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.k === kind));
	$('expText').value = exportText(kind);
}
$('bExport').onclick = () => { $('dlg').showModal(); showExport(expKind); };
$('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) showExport(b.dataset.k); };
$('bClose').onclick = () => $('dlg').close();
$('bCopy').onclick = () => {
	const ta = $('expText');
	navigator.clipboard.writeText(ta.value).then(() => toast('Copied'), () => { ta.focus(); ta.select(); toast('Selected, press Ctrl+C to copy'); });
};
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
vid.addEventListener('click', () => (audio.playing ? pause() : play()));
})();
</script>
