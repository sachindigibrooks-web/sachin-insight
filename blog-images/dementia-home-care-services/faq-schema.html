      "name": "What is the difference between dementia and Alzheimer's disease?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Dementia is an umbrella term for a group of symptoms, including memory loss, confusion and changes in behaviour and language. Alzheimer's disease is the most common cause of dementia. Other types exist, such as vascular dementia, and the right care depends on the person's symptoms rather than the label."

      "@type": "Question",
      "name": "When should someone with dementia stop living alone?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "There is no fixed point. It depends on safety, confidence and the support available. Missed meals, medication errors, getting lost or leaving appliances on are signs that more help is needed. Many families start with visiting care and add overnight or live in support as needs grow."
      }
    },
    {
      "@type": "Question",
      "name": "What can I do if my parent with dementia refuses help?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "This is very common and understandable. Introduce help gradually, present it as company or help around the house rather than \"care\", and start with short visits at the time of day they feel most settled. Involving them in choices and keeping the same carer where possible helps trust to build."
      }
    },
    {
      "@type": "Question",
      "name": "Who pays for dementia care at home?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on needs and finances. The council may contribute after a care needs assessment and a financial assessment, many families pay privately, and Attendance Allowance may help if you qualify. Start by asking your local council for a free needs assessment."

      "@type": "Question",
      "name": "Is live in care better than visiting care for dementia?",
      "acceptedAnswer": {
        "@type": "Answer",
